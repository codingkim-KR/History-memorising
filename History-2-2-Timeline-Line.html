<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대통령 임기 타임라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* VOICE 차분한 시험 공부용 도구 — 정리 노트와 같은 종이색·글꼴
   IDEA 벽에 거는 긴 연표 두루마리: 임기 띠 위에 사건 표지를 꽂아 둔 것
   PICTURE 시간 비례 축 하나와 임기별 색띠, 표지를 누르면 열리는 카드
   COLOUR 종이(#f4efe2)·먹색, 갈래 다섯 색은 모양(●■◆▲◎)과 함께 쓴다
   TYPE Gowun Batang 제목, IBM Plex Sans KR 본문, IBM Plex Mono 날짜 */
:root{
  --paper:#f4efe2; --paper2:#ebe4d2; --card:#fbf8f0; --ink:#22201b; --ink2:#575246; --ink3:#857f70;
  --line:#d6cdb8; --line2:#c2b89f;
  --red:#a5392c; --red-bg:#f3dfd9; --green:#2b6157; --green-bg:#dbe9e3; --brass:#9a7426; --brass-bg:#f1e6c8;
  --blue:#2f5d86; --blue-bg:#dde7f1; --plum:#6b4a87; --plum-bg:#ebe2f2;
  --s0:#fbf8f0; --s1:#efe8d6;
  --f-disp:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --shadow:0 2px 4px rgba(60,50,20,.08),0 10px 28px rgba(60,50,20,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191814; --paper2:#211f1a; --card:#24221c; --ink:#ece6d6; --ink2:#bdb5a2; --ink3:#948d7b;
  --line:#3a372e; --line2:#504b3e;
  --red:#e58a7b; --red-bg:#3d221d; --green:#7fc2b0; --green-bg:#1c332d; --brass:#d9b566; --brass-bg:#3a3018;
  --blue:#8db8e0; --blue-bg:#1d2c3b; --plum:#c6a8e2; --plum-bg:#2e2439; --s0:#1d1c17; --s1:#25231d;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#191814; --paper2:#211f1a; --card:#24221c; --ink:#ece6d6; --ink2:#bdb5a2; --ink3:#948d7b;
  --line:#3a372e; --line2:#504b3e;
  --red:#e58a7b; --red-bg:#3d221d; --green:#7fc2b0; --green-bg:#1c332d; --brass:#d9b566; --brass-bg:#3a3018;
  --blue:#8db8e0; --blue-bg:#1d2c3b; --plum:#c6a8e2; --plum-bg:#2e2439; --s0:#1d1c17; --s1:#25231d;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;}
.L-P{--lc:var(--red)} .L-M{--lc:var(--green)} .L-E{--lc:var(--brass)} .L-C{--lc:var(--blue)} .L-K{--lc:var(--plum)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ── 틀 */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hd{flex:none;background:var(--paper2);border-bottom:1px solid var(--line);padding:8px 14px 8px;z-index:30;position:relative}
.r1{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;min-width:0}
.ttl h1{font-family:var(--f-disp);font-size:22px;line-height:1.2;margin:0;white-space:nowrap}
.here{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.here b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--line2);min-height:34px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--card);overflow:hidden}
.zoom button{border:0;background:transparent;width:36px;min-height:34px;font-size:18px;cursor:pointer;line-height:1}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom span{font-size:12px;color:var(--ink2);padding:0 4px;min-width:74px;text-align:center}
.tbtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13.5px;min-height:34px;line-height:1.4}
.tbtn:hover,.seg button:hover,.zoom button:hover:not(:disabled){border-color:var(--ink3)}
.badge[hidden]{display:none}
.badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--brass);color:var(--paper);font-size:11.5px;line-height:18px;text-align:center}
.filters{padding:8px 0 2px}
.filters[hidden]{display:none}
.fr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fr+.fr{margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:3px 12px 3px 10px;font-size:13.5px;cursor:pointer;min-height:32px}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;min-height:32px}
.tog select{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:2px 4px}
.search{flex:1;min-width:150px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 10px;font-size:16px;min-height:36px}
.count{font-size:13px;color:var(--ink3)}
.r2{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:7px}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--ink2);align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend .lw{color:var(--brass)}
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;padding:1px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;min-height:30px}
.jump button.gap{color:var(--ink3);border-style:dashed}
.jump button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mini{position:relative;height:30px;margin-top:8px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none;background:var(--card)}
.mtr{position:absolute;inset:0}
.mtr .ms{position:absolute;top:0;bottom:0;border-right:1px solid var(--line2);background:var(--s0)}
.mtr .ms.g1{background:var(--s1)}
.mtr .ms.k-acting,.mtr .ms.k-pre{background:repeating-linear-gradient(135deg,var(--brass-bg) 0 3px,var(--s0) 3px 6px)}
.mtr .ms.k-junta{background:repeating-linear-gradient(135deg,var(--red-bg) 0 3px,var(--s0) 3px 6px)}
.mtr .mt{position:absolute;bottom:2px;width:1px;height:9px;background:var(--ink3);opacity:.6}
.mtr .my{position:absolute;top:1px;font-family:var(--f-mono);font-size:11px;color:var(--ink3);transform:translateX(-50%);pointer-events:none}
.mwin{position:absolute;top:0;bottom:0;border:2px solid var(--ink);border-radius:4px;background:rgba(120,110,80,.12);pointer-events:none;min-width:6px}
@media (max-width:480px){ #zLab{display:none} .zoom button{width:38px} .seg button{padding:5px 8px} .tbtn{padding:5px 9px} .tools{gap:5px} }
@media (max-height:520px){
  .ttl h1,.legend{display:none}
  .hd{padding:5px 10px}
  .r2{margin-top:4px}
  .mini{height:24px;margin-top:5px}
  .seg button,.tbtn,.zoom button{min-height:30px}
  .jump button{min-height:28px}
}
@media (max-width:760px){
  .legend{display:none}
  .ttl h1{font-size:19px}
  .here{max-width:92vw;font-size:13px}
  .hd{padding:7px 10px}
}

/* ── 보는 창과 화폭 */
.vp{flex:1;position:relative;overflow:auto;overscroll-behavior:contain;background:var(--paper);outline:none}
.vp.grab{cursor:grabbing;user-select:none}
.cv{position:relative}
.stripe{position:absolute;pointer-events:none;background:var(--s0)}
.stripe.g1{background:var(--s1)}
.stripe.k-acting,.stripe.k-pre{background:repeating-linear-gradient(135deg,var(--brass-bg) 0 5px,transparent 5px 12px)}
.stripe.k-junta{background:repeating-linear-gradient(135deg,var(--red-bg) 0 5px,transparent 5px 12px)}
.cv.h .stripe{border-left:1px solid var(--line)}
.cv.v .stripe{border-top:1px solid var(--line)}
#grid{position:absolute;inset:0;pointer-events:none}
.gl{position:absolute;background:var(--line);opacity:.55}
.gl.M{opacity:1}
.cv.h .gl{width:1px} .cv.v .gl{height:1px}
.yl{position:absolute;font-family:var(--f-mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.cv.h .yl{top:4px;transform:translateX(-50%)}
.cv.v .yl{text-align:right;transform:translateY(-50%)}
.yl.M{color:var(--ink2);font-weight:500}
.axis{position:absolute;background:var(--ink);z-index:3;pointer-events:none;border-radius:2px}
.links{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
.links line{stroke:var(--line2);stroke-width:1}
.links line.on{stroke:var(--ink);stroke-width:1.6}
.links line.bc{stroke:var(--ink3);stroke-dasharray:2 3}
.rbar{position:absolute;z-index:4;background:var(--lc,var(--ink));opacity:.35;border-radius:4px;pointer-events:none}
.rbar[hidden]{display:none}
.bp{position:absolute;z-index:6;border:1px solid var(--line2);border-left:4px solid var(--green);background:var(--card);border-radius:5px;padding:2px 8px 2px 6px;font-size:12.5px;line-height:1.35;cursor:pointer;text-align:left;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bp b{font-weight:600}
.bp i{font-style:normal;color:var(--ink3);margin-left:5px}
.bp.k-acting,.bp.k-pre{border-left-color:var(--brass)}
.bp.k-junta{border-left-color:var(--red)}
.bp.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bp.on i{color:var(--paper)}
.cv.v .bp{white-space:normal;padding:3px 6px}
.cv.v .bp i{display:block;margin-left:0;font-size:11.5px}
.bp.nw i{display:none!important}

/* 사건 표지: 모양으로도 갈래를 구분(색만으로 구분하지 않는다) */
.mk{position:absolute;z-index:7;width:24px;height:24px;margin:-12px 0 0 -12px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.sh{display:inline-block;width:10px;height:10px;background:var(--lc);flex:none}
.mk.c .sh{width:13px;height:13px}
.L-P .sh{border-radius:50%}
.L-M .sh{border-radius:2px}
.L-E .sh{transform:rotate(45deg) scale(.86);border-radius:1px}
.L-C .sh{clip-path:polygon(50% 4%,100% 96%,0 96%);width:12px;height:12px}
.mk.c.L-C .sh{width:15px;height:15px}
.L-K .sh{border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--lc)}
.sh.star{background:none;width:auto;height:auto;color:var(--brass)}
.sh.star::before{content:"★";font-size:12px;line-height:1}
.mk:hover .sh,.mk:focus-visible .sh{filter:brightness(1.15);outline:2px solid var(--ink3);outline-offset:2px}
.mk.on{z-index:9}
.mk.on .sh{outline:3px solid var(--ink);outline-offset:3px}
.mk[hidden],.lb[hidden],.cv.v .lb[hidden],.cv.h .lb[hidden]{display:none!important}
.lb{position:absolute;z-index:5;left:0;top:0;border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:2px 8px;font-size:13px;line-height:1.45;cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.lb.c{font-weight:600;border-color:var(--ink3)}
.lb.w::before{content:"⚑";color:var(--brass);margin-right:4px;font-weight:700}
.lb .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);font-weight:400;margin-right:6px}
.cv.h .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.h .lb .d{display:none}
.cv.v .lb{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lb:hover,.lb:focus-visible{z-index:8;border-color:var(--ink)}
.lb.on{background:var(--ink);color:var(--paper);border-color:var(--ink);z-index:8}
.lb.on .d{color:var(--paper)}
.empty{position:sticky;left:20px;top:40%;z-index:9;display:inline-block;margin:40px 20px;padding:10px 14px;background:var(--card);border:1px solid var(--line2);border-radius:8px;color:var(--ink2)}
.empty[hidden]{display:none}
.hint{position:absolute;left:12px;bottom:12px;z-index:20;max-width:calc(100% - 24px);padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);box-shadow:0 1px 3px rgba(0,0,0,.08);pointer-events:none}
.hint[hidden],body.pop .hint{display:none}
@media (max-width:480px){.hint{font-size:12px;left:8px;bottom:8px}}
.vpw{flex:1;position:relative;min-height:0;display:flex}
.vpw .vp{flex:1}

/* ── 자세히 카드 */
.panel{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel[hidden]{display:none}
.panel.side{right:14px;top:var(--ptop,120px);bottom:14px;width:min(400px,40vw);border-radius:12px}
.panel.sheet{left:0;right:0;bottom:0;max-height:52vh;border-radius:14px 14px 0 0;max-width:760px;margin:0 auto}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;border-bottom:1px solid var(--line)}
.pband{flex:1;min-width:0;text-align:left;border:0;background:transparent;cursor:pointer;padding:2px 0;font-size:13.5px;color:var(--ink2)}
.pband b{color:var(--ink)}
.pband:hover{text-decoration:underline;text-underline-offset:3px}
.x{flex:none;border:1px solid var(--line2);background:var(--paper);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:15px}
.pb{flex:1;overflow:auto;padding:12px 16px 14px}
.pf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.pf[hidden]{display:none}
.pf span{font-size:12.5px;color:var(--ink3)}
.pd{font-family:var(--f-mono);font-size:14px;color:var(--ink2)}
.pd small{font-size:12px;color:var(--ink3);margin-left:6px}
.pt{font-family:var(--f-disp);font-size:22px;line-height:1.35;margin:4px 0 6px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:12px;line-height:1.6;padding:0 7px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);background:var(--paper)}
.tag.core{border-color:var(--brass);color:var(--brass)}
.tag.nk{background:var(--plum-bg);border-color:transparent;color:var(--ink)}
.tag.ab{background:var(--blue-bg);border-color:transparent;color:var(--ink)}
.pdesc{margin:0 0 8px;color:var(--ink2)}
.ps2{margin:0 0 8px;color:var(--ink2)}
.ps2::before{content:"＋ ";color:var(--ink3)}
.pnote{margin:6px 0;padding:6px 10px;background:var(--brass-bg);border-left:3px solid var(--brass);border-radius:0 6px 6px 0;font-size:14px}
.pnote::before{content:"⚑ ";color:var(--brass);font-weight:700}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.pmeta .ln{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.ref{border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--paper);white-space:nowrap}
.bdl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0;font-size:14px}
.bdl dt{font-weight:600;white-space:nowrap}
.bdl dd{margin:0;color:var(--ink2)}
.bfacts{margin:6px 0 10px;padding-left:1.1em;font-size:14px;color:var(--ink2)}
.blist{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.blist li{border-bottom:1px solid var(--line)}
.blist button{display:grid;grid-template-columns:104px 1fr;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 2px;cursor:pointer;font-size:13.5px;align-items:baseline}
.blist button:hover{background:var(--paper)}
.blist .d{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.blist .c{font-weight:600}
.bhint{font-size:13px;color:var(--ink3);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{.hd,.panel{display:none} body{overflow:visible} .app{height:auto}}
</style>
</head>
<body>
<div class="app">
<header class="hd">
  <div class="r1">
    <div class="ttl"><h1>대통령 임기 타임라인</h1><div class="here" id="here" aria-live="polite"></div></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="방향"><button type="button" data-o="auto">자동</button><button type="button" data-o="h">가로</button><button type="button" data-o="v">세로</button></div>
      <div class="zoom" role="group" aria-label="확대"><button type="button" id="zOut" aria-label="축소">−</button><span id="zLab" class="mono"></span><button type="button" id="zIn" aria-label="확대">+</button></div>
      <button type="button" class="tbtn" id="fBtn" aria-expanded="false" aria-controls="filters">거르기<span id="fBadge" class="badge" hidden></span></button>
      <button type="button" class="tbtn theme" aria-label="밝게·어둡게">◐</button>
    </div>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="fr"><button type="button" class="chip L-P" data-lane="P" aria-pressed="true"><span class="sh"></span>정치·헌법·선거</button><button type="button" class="chip L-M" data-lane="M" aria-pressed="true"><span class="sh"></span>민주화·시민 운동</button><button type="button" class="chip L-E" data-lane="E" aria-pressed="true"><span class="sh"></span>경제·노동·사회</button><button type="button" class="chip L-C" data-lane="C" aria-pressed="true"><span class="sh"></span>교육·문화·역사 인식</button><button type="button" class="chip L-K" data-lane="K" aria-pressed="true"><span class="sh"></span>남북·북한·외교</button></div>
    <div class="fr">
      <span class="seg" role="group" aria-label="출처"><button type="button" data-src="all" aria-pressed="true">두 노트</button><button type="button" data-src="B" aria-pressed="false">II단원 3~5강</button><button type="button" data-src="A" aria-pressed="false">I·III단원</button></span>
      <label class="tog"><input type="checkbox" id="fCore"> ★ 핵심만</label>
      <label class="tog"><input type="checkbox" id="fWarn"> ⚑ 경계 메모만</label>

  var k=st.o, n=Math.max(0,Math.min(ZOOMS.length-1,st.zi[k]+d)); if(n===st.zi[k]) return;
  var c=centerDate(); st.zi[k]=n; store.set('tl-z-'+k,n); layout();
  if(st.pmode==='ev'&&st.sel!=null){ ensureVisible(EMAP[st.sel],true); } else { scrollToDate(c,.5,false); if(st.o==='h') centerCross(); }
}
$('#zIn').addEventListener('click',function(){zoom(1);});
$('#zOut').addEventListener('click',function(){zoom(-1);});
function decideO(){return st.orient==='auto'?(window.innerWidth>=window.innerHeight?'h':'v'):st.orient;}
function updSeg(){$$('.r1 .seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.o===st.orient?'true':'false'); b.title=b.dataset.o==='auto'?'화면 모양에 맞춰 바꾼다(지금: '+(st.o==='h'?'가로':'세로')+')':'';});}
function applyOrient(force){
  var o=decideO(); if(o===st.o&&!force) return;
  var had=st.o!=null, c=had?centerDate():null;
  st.o=o; mkey=null; layout(); placePanel();
  if(st.pmode==='ev'&&st.sel!=null) ensureVisible(EMAP[st.sel],true);
  else if(c!=null){ scrollToDate(c,.5,false); centerCross(); }
  updSeg();
}
$$('.r1 .seg button').forEach(function(b){b.addEventListener('click',function(){st.orient=b.dataset.o; store.set('tl-orient',st.orient); applyOrient(true);});});
var rt=0, lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',function(){clearTimeout(rt); rt=setTimeout(function(){
  var o=decideO(), wChanged=Math.abs(window.innerWidth-lastW)>2; lastW=window.innerWidth; lastH=window.innerHeight;
  if(o!==st.o) applyOrient(true);
  else if(st.o==='v'&&wChanged){var c=centerDate(); mkey=null; layout(); scrollToDate(c,.5,false);}
  else if(st.o==='h'){var c2=centerDate(); layout(); scrollToDate(c2,.5,false);}
  placePanel();
},160);});

/* ── 거르기 */
var fBtn=$('#fBtn'), filters=$('#filters');
fBtn.addEventListener('click',function(){var open=filters.hidden; filters.hidden=!open; fBtn.setAttribute('aria-expanded',open?'true':'false'); placePanel(); var c=centerDate(); layout(); scrollToDate(c,.5,false);});
function refilter(){
  var c=centerDate(); layout(); scrollToDate(c,.5,false);
  if(st.pmode==='ev'&&st.sel!=null&&!passes(EMAP[st.sel])) closePanel();
  else if(st.pmode==='band') openBand(st.band,false);
  else if(st.pmode==='ev') openEv(st.sel,false);
}
function updCount(n){
  $('#count').textContent=EV.length+'건 중 '+n+'건';
  var a=0; if(!(st.lanes.P&&st.lanes.M&&st.lanes.E&&st.lanes.C&&st.lanes.K)) a++; if(st.src!=='all') a++; if(st.core) a++; if(st.warn) a++; if(st.q) a++;
  var bd=$('#fBadge'); bd.hidden=!a; bd.textContent=a;
}
$$('.chip[data-lane]').forEach(function(c){c.addEventListener('click',function(){
  var l=c.dataset.lane, on=c.getAttribute('aria-pressed')==='true', nOn=Object.keys(st.lanes).filter(function(k){return st.lanes[k];}).length;
  if(on&&nOn===1){Object.keys(st.lanes).forEach(function(k){st.lanes[k]=1;}); $$('.chip[data-lane]').forEach(function(x){x.setAttribute('aria-pressed','true');});}
  else {st.lanes[l]=on?0:1; c.setAttribute('aria-pressed',on?'false':'true');}
  refilter();
});});
$$('.filters .seg button[data-src]').forEach(function(b){b.addEventListener('click',function(){st.src=b.dataset.src; $$('.filters .seg button[data-src]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');}); refilter();});});
$('#fCore').addEventListener('change',function(e){st.core=e.target.checked; refilter();});
$('#fWarn').addEventListener('change',function(e){st.warn=e.target.checked; refilter();});
$('#fMode').addEventListener('change',function(e){st.mode=e.target.value; refilter();});
var qt=0; $('#fQ').addEventListener('input',function(e){clearTimeout(qt); qt=setTimeout(function(){st.q=e.target.value.toLowerCase().replace(/\s+/g,''); refilter();},150);});
$('#fReset').addEventListener('click',function(){
  st.lanes={P:1,M:1,E:1,C:1,K:1}; $$('.chip[data-lane]').forEach(function(x){x.setAttribute('aria-pressed','true');});
  st.src='all'; $$('.filters .seg button[data-src]').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.src==='all'?'true':'false');});
  st.core=false; st.warn=false; st.q=''; st.mode='all'; $('#fCore').checked=false; $('#fWarn').checked=false; $('#fQ').value=''; $('#fMode').value='all';
  refilter();
});

/* ── 글쇠 */
document.addEventListener('keydown',function(ev){
  var tg=ev.target, tn=tg&&tg.tagName;
  if(tn==='INPUT'||tn==='SELECT'||tn==='TEXTAREA') return;
  if(ev.key==='Escape'&&!panel.hidden){closePanel(); ev.preventDefault(); return;}
  if(!panel.hidden&&(ev.key==='ArrowRight'||ev.key==='ArrowDown')&&tg!==mini){stepNav(1); ev.preventDefault(); return;}
  if(!panel.hidden&&(ev.key==='ArrowLeft'||ev.key==='ArrowUp')&&tg!==mini){stepNav(-1); ev.preventDefault(); return;}
  if(ev.key==='+'||ev.key==='='){zoom(1);} else if(ev.key==='-'||ev.key==='_'){zoom(-1);}
});

/* ── 시작 */
st.o=decideO(); updSeg(); layout(); placePanel(); centerCross(); updHere();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){
  var atStart=(st.o==='h'?vp.scrollLeft:vp.scrollTop)<2, c=centerDate();
  mkey=null; layout(); if(atStart){ if(st.o==='h') vp.scrollLeft=0; else vp.scrollTop=0; centerCross(); } else scrollToDate(c,.5,false);
});}
window.__tl={st:st,EV:EV,G:function(){return G;},layout:layout,openEv:openEv,openBand:openBand,zoom:zoom,setO:function(o){st.orient=o;applyOrient(true);}};
})();
</script>
</body>
</html>
